# Render Blueprint: New > Blueprint > pick this repo. One web service serves the API and the website.
services:
  - type: web
    name: learnace
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # your Neon connection string (pooled is fine)
        sync: false
      - key: ADMIN_EMAIL         # first super admin, created on first start
        sync: false
      - key: ADMIN_PASSWORD      # 10+ characters
        sync: false
      - key: JWT_SECRET          # generated for you
        generateValue: true
      - key: SEED_SAMPLE         # true = load 27 demo questions + 1 test (only into an empty database)
        value: "false"
      - key: REGISTRATION_OPEN
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME   # image uploads (banners, covers); get these from cloudinary.com > API Keys
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
